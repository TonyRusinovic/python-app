apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  labels:
    app: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: python-app
        image: afrusinovic/flask:v1
        ports:
        - containerPort: 5000
